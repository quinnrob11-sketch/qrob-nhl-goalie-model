name: Rebuild goalie model

on:
  schedule:
    # 11am ET (after fastRhockey's overnight refresh), then 2pm, 4pm, 6pm and
    # 7pm ET so starters / saves lines are picked up as PrizePicks posts them.
    # (UTC times; during standard time these land an hour earlier in ET.)
    - cron: '0 15 * * *'
    - cron: '0 18 * * *'
    - cron: '0 20 * * *'
    - cron: '0 22 * * *'
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: goalie-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Build dashboard
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python model/build_site.py
      - name: Commit & push
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add index.html
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "auto: rebuild $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do git push && exit 0; git pull --rebase origin "${GITHUB_REF_NAME}"; sleep $((i*3)); done
          exit 1

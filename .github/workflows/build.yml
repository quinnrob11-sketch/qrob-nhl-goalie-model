name: Rebuild goalie model

on:
  schedule:
    # UTC times. GitHub cron is best effort: scheduled runs are often delayed and many are dropped
    # outright when GitHub is busy (on 2026-11-05 the */15 schedule fired at 01:02, 04:09 and 12:15 UTC
    # only). The 15-minute cadence therefore comes from .github/workflows/ticker.yml, which dispatches
    # this workflow every 15 minutes during board hours; these schedules are only the grading runs and
    # an hourly backup (off the top of the hour, where GitHub drops the most).
    # 12:30 UTC (7:30am CT): grade last night's games once the box scores land; 13:15 is a backup.
    - cron: '30 12 * * *'
    - cron: '15 13 * * *'
    - cron: '41 14-23 * * *'
    - cron: '41 0-6 * * *'
  workflow_dispatch:
  # A push to main rebuilds the site. The commit this job pushes uses the
  # Actions token, which does not start another run, so this does not loop.
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: goalie-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      # MoneyPuck cache (data checks): its own step, hard-capped so a slow download never holds up the build
      - name: MoneyPuck data
        run: timeout 300 python -u model/moneypuck_teams.py || echo "moneypuck step timed out or failed"
      - name: Build dashboard
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python model/build_site.py
      # every successful build is committed and pushed, even if only timestamps changed, so Vercel deploys it
      - name: Commit & push
        run: bash model/publish.sh
      # after the commit, so the site still updates (and shows its stale banner)
      - name: Data freshness
        run: python model/freshness.py

name: Rebuild goalie model

on:
  schedule:
    # UTC times. 12:30 UTC (7:30am CT): grade last night's games once the box
    # scores land; 13:15 is a backup (GitHub sometimes drops or delays scheduled
    # runs). Then every 15 minutes from 14:00 UTC (9am CT) to 06:45 UTC (1:45am CT):
    # boards (Pick6) refresh and started games drop off, live / final results show
    # until the night's last game is final. DraftKings is re-pulled at most once
    # every 55 minutes (model/odds.py caches it) to stay inside the Odds API quota.
    - cron: '30 12 * * *'
    - cron: '15 13 * * *'
    - cron: '*/15 14-23 * * *'
    - cron: '*/15 0-6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: goalie-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Build dashboard
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python model/build_site.py
      - name: Commit & push
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add index.html model/data/calls model/data/real_line_log.csv model/data/dk_prices.csv model/output/tracking.json model/output/calibration.json
          git add model/data/legs.csv model/data/rosters.json model/data/odds_cache.json 2>/dev/null || true
          git add -A model/data/pick6_failed.html 2>/dev/null || true
          git add model/data/moneypuck 2>/dev/null || true
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "auto: rebuild $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do git push && exit 0; git pull --rebase origin "${GITHUB_REF_NAME}"; sleep $((i*3)); done
          exit 1
      # after the commit, so the site still updates (and shows its stale banner)
      - name: Data freshness
        run: python model/freshness.py

name: Rebuild goalie model

on:
  schedule:
    # UTC times. 12:30 UTC (7:30am CT): grade last night's games once the box
    # scores land. 13:15 and 14:00 UTC are backups: GitHub sometimes drops or
    # delays scheduled runs (12:30 didn't run Oct 22-24). Then 15:00, 18:00,
    # 20:00, 22:00 and 23:00 UTC pick up starters and lines as they post.
    - cron: '30 12 * * *'
    - cron: '15 13 * * *'
    - cron: '0 14 * * *'
    - cron: '0 15 * * *'
    - cron: '0 18 * * *'
    - cron: '0 20 * * *'
    - cron: '0 22 * * *'
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: goalie-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Build dashboard
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python model/build_site.py
      - name: Commit & push
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add index.html model/data/calls model/data/real_line_log.csv model/data/dk_prices.csv model/output/tracking.json model/output/calibration.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "auto: rebuild $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do git push && exit 0; git pull --rebase origin "${GITHUB_REF_NAME}"; sleep $((i*3)); done
          exit 1
      # after the commit, so the site still updates (and shows its stale banner)
      - name: Data freshness
        run: python model/freshness.py

name: tmp fetch NHL box scores
on:
  push:
    branches: [claude/nhl-goalie-model-update-zba2yo]
    paths: [.github/workflows/tmp-fetch-box.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fetch box scores for 2026-10-15
        run: |
          python3 - <<'PY'
          import json, urllib.request
          get = lambda u: json.load(urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": "qrob"}), timeout=30))
          day = "2026-10-15"
          games = [g for g in get(f"https://api-web.nhle.com/v1/score/{day}")["games"]]
          out = []
          for g in games:
              out.append(get(f"https://api-web.nhle.com/v1/gamecenter/{g['id']}/boxscore"))
          json.dump(out, open("box_2026-10-15.json", "w"))
          print(len(out), "games")
          PY
      - name: Commit
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add box_2026-10-15.json && git commit -m "tmp: Oct 15 box scores" && git push

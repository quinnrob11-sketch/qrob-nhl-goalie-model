name: Rebuild ticker

# GitHub's cron is best effort (runs are delayed or dropped under load), so the 15-minute rebuilds are
# driven from here: one long job dispatches "Rebuild goalie model" every 15 minutes while it is board time
# (9:00 AM - 1:45 AM America/Chicago) and re-dispatches itself before the 6-hour job limit. Dispatches made
# with the workflow token do start runs (workflow_dispatch is the documented exception).
# The chain runs around the clock (outside board hours it only sleeps), so the morning start never waits on
# a cron run: on Nov 6 and 7 the chain stopped at 1:45 AM and the cron seeds meant to restart it at 9 AM
# were dropped, leaving the board hours stale. The schedules below only restart the chain if it ever breaks;
# the concurrency group keeps a single chain.
on:
  schedule:
    - cron: '4 */2 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: rebuild-ticker
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Dispatch a rebuild every 15 minutes during board hours
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          in_hours() {   # 09:00-23:59 or 00:00-01:45 America/Chicago (DST handled by TZ)
            local hm=$((10#$(TZ=America/Chicago date +%H%M)))
            [ "$hm" -ge 900 ] || [ "$hm" -le 145 ]
          }
          end=$(( $(date +%s) + 330 * 60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            if in_hours; then
              gh workflow run build.yml --ref main && echo "dispatched build at $(date -u +%H:%M) UTC" || echo "dispatch failed"
            fi
            sleep 900
          done
          # always renew (outside board hours too), so 9 AM never depends on a cron run firing
          for i in 1 2 3; do gh workflow run ticker.yml --ref main && echo "chain renewed" && exit 0; sleep 20; done
          exit 1

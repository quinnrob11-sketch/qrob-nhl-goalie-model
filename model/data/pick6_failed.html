function checkClientHints() {

		const [key, value] = cur.split('=');
		acc[key] = value;
		return acc;
	}, {});

	let cookieChanged = false;

	{ name: "CH-time-zone", actual: String(Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC"), value: cookies["CH-time-zone"] != null ? cookies["CH-time-zone"] : encodeURIComponent("UTC") }

	}
	if (cookieChanged) window.location.reload();
}
